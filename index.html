<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="coin.ico" type="image/x-icon">
    <title>R.E.P.O MEME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <style>
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #3b883f;
        z-index: 10;
      }

      @keyframes spin {
        from {
          transform: rotateY(0deg);
        }
        to {
          transform: rotateY(360deg);
        }
      }

      #loader > img {
        width: 72px;
        height: 72px;
        animation: spin 1.5s linear infinite;
      }
    
      #app {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="modal">
        <p id="game-message"></p>
        <button id="start">Game Start</button>
      </div>
      <div id="modal-pause">
        <p id="pause-message">Game is paused</p>
      </div>
      <div id="field">
        <div>
          <span>Coins: </span> 
          <span id="coins-count">0</span>
          <span> / 10</span>
        </div>
        <div>
          <span>Time: </span>
          <span id="time">05:00</span>
        </div>
        <div id="music" style="opacity: 0.5">
          <img src="assets/music-on.svg" alt="music" width="25" height="25">
        </div>
      </div>
      <div id="gameplay">
        <p>Hold F to start collecting coin</p>
        <p>Press E to sing</p>
        <p>Press Esc to pause/continue the game</p>
      </div>
    </div>
    <div id="loader">
      <img src="coin.ico" alt="Loading..." />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
